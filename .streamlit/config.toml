[theme]
base = "light"
primaryColor = "#E07A3F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1F2A37"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600]
baseRadius = "0.6rem"
borderColor = "#E3E8EF"
showSidebarBorder = true
chartCategoricalColors = ["#4C78A8", "#E07A3F", "#59A14F", "#B07AA1", "#9C755F", "#76B7B2"]

[client]
toolbarMode = "minimal"
